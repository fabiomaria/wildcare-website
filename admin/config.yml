  - name: workshops_de
    label: Workshops — German primary
    folder: content/workshops
    create: true
    extension: yaml
    format: yaml
    identifier_field: global.id
    slug: '{{slug}}'
    summary: '{{global.id}}'
    fields:
      - name: schema_version
        label: Schema version
        widget: hidden
        default: 2
        i18n: false
      - name: global
        label: Shared settings
        widget: object
        collapsed: false
        fields:
          - name: id
            label: Stable ID
            widget: string
            default: ''
            hint: Lowercase letters and hyphens; must match the filename.
          - name: primary_locale
            label: Primary language
            widget: select
            options:
              - label: German primary
                value: de
              - label: English primary
                value: en
            default: de
            hint: Determines which CMS collection exposes this entry. Keep the primary language first in the saved file.
          - name: status
            label: Status
            widget: select
            options:
              - draft
              - upcoming
              - current
              - past
              - unlisted
            default: draft
          - name: route
            label: Canonical route
            widget: string
            hint: Start with / and keep existing public URLs stable.
          - name: start_at
            label: Start date for sorting
            widget: datetime
            required: false
          - name: sort_order
            label: Sort order when dates match
            widget: number
            value_type: int
            required: false
            min: 0
          - name: detail_page
            label: Publish detail page
            widget: boolean
            default: true
          - name: registration
            label: Shared registration
            widget: object
            fields:
              - name: url
                label: Registration link
                widget: string
                required: false
              - name: availability
                label: Availability
                widget: select
                options:
                  - available
                  - sold_out
                  - waitlist
                  - unavailable
          - name: venue
            label: Venue
            widget: relation
            collection: venues
            search_fields:
              - global.name
            value_field: global.id
            display_fields:
              - global.name
            hint: Pick from the Venues collection. Shows the venue name, not its internal ID.
            required: false
          - name: updated_at
            label: Last updated
            widget: datetime
            required: false
          - name: schedule
            label: Structured schedule (calendar, JSON-LD, .ics)
            widget: object
            required: false
            hint: Drives the add-to-calendar links, search-engine event markup, and the sitewide upcoming-events lists. Leave the whole section empty for a workshop with no calendar-tracked dates.
            fields:
              - name: event_status
                label: Schedule status
                widget: select
                options:
                  - label: Scheduled
                    value: scheduled
                  - label: Cancelled
                    value: cancelled
                  - label: Postponed (new date not yet set)
                    value: postponed
                  - label: Rescheduled (new date set below)
                    value: rescheduled
                  - label: Moved online
                    value: moved_online
                default: scheduled
              - name: previous_start_local
                label: Original start time (only if rescheduled)
                widget: string
                required: false
                hint: 'Leave empty unless Schedule status is Rescheduled. Format: YYYY-MM-DDTHH:mm, local time, no timezone letter. Example: 2026-10-02T19:00.'
              - name: mode
                label: Schedule type
                widget: select
                options:
                  - label: Dates — one or more specific sessions
                    value: dates
                  - label: Recurring — a repeating weekly class
                    value: recurring
                default: dates
                hint: Use Dates for a workshop or one-off event. Use Recurring only for an ongoing weekly class like Montagskurs.
              - name: sessions
                label: Sessions (Dates mode only)
                widget: list
                required: false
                hint: One entry per session (e.g. a Friday evening and a Saturday day session both belong to the same workshop). Leave empty in Recurring mode.
                fields:
                  - name: id
                    label: Session ID
                    widget: string
                    hint: A short stable slug, e.g. fri-eve or sat-morning. Never rename after publishing — it is used as part of the calendar entry's permanent ID.
                  - name: start_local
                    label: Start
                    widget: string
                    hint: 'Local wall-clock time, no timezone. Format: YYYY-MM-DDTHH:mm. Example: 2026-10-09T19:00.'
                  - name: end_local
                    label: End
                    widget: string
                    hint: 'Local wall-clock time, no timezone. Format: YYYY-MM-DDTHH:mm. Example: 2026-10-09T21:00.'
                  - name: status
                    label: Status override for this session only
                    widget: select
                    required: false
                    hint: Leave empty to use the overall Schedule status above. Set this only when a single session (not the whole workshop) is cancelled or moved.
                    options:
                      - label: Scheduled
                        value: scheduled
                      - label: Cancelled
                        value: cancelled
                      - label: Postponed
                        value: postponed
                      - label: Rescheduled
                        value: rescheduled
                      - label: Moved online
                        value: moved_online
              - name: recurrence
                label: Weekly recurrence (Recurring mode only)
                widget: object
                required: false
                fields:
                  - name: weekday
                    label: Day of the week
                    widget: select
                    options:
                      - label: Monday
                        value: monday
                      - label: Tuesday
                        value: tuesday
                      - label: Wednesday
                        value: wednesday
                      - label: Thursday
                        value: thursday
                      - label: Friday
                        value: friday
                      - label: Saturday
                        value: saturday
                      - label: Sunday
                        value: sunday
                  - name: start_time
                    label: Start time
                    widget: string
                    hint: '24-hour clock, no seconds. Example: 17:45.'
                  - name: end_time
                    label: End time
                    widget: string
                    hint: '24-hour clock, no seconds. Example: 19:15.'
                  - name: anchor
                    label: First occurrence date
                    widget: string
                    hint: 'The very first date this weekly pattern started (or starts). Format: YYYY-MM-DD. Example: 2026-01-05.'
                  - name: horizon_months
                    label: Show occurrences this many months ahead
                    widget: number
                    value_type: int
                    hint: 'Controls how far into the future the website lists upcoming dates for this class. Example: 6. Does not limit the calendar subscription feed, which is unbounded.'
                  - name: except
                    label: Skipped dates (holidays, breaks)
                    widget: list
                    required: false
                    hint: 'Dates to remove from the weekly pattern. Format: YYYY-MM-DD, one per entry.'
                    field:
                      name: date
                      label: Date
                      widget: string
              - name: featured_occurrences
                label: Special sessions (guest teacher, highlighted date)
                widget: list
                required: false
                hint: Highlights one specific occurrence of a recurring class with its own note and, optionally, a dedicated page. The date must match a real occurrence of the weekly pattern above.
                fields:
                  - name: id
                    label: Date
                    widget: string
                    hint: 'Format: YYYY-MM-DD. Example: 2026-11-16.'
                  - name: teacher
                    label: Guest teacher name
                    widget: string
                    required: false
          - name: hero
            label: Page hero
            widget: object
            collapsed: true
            required: false
            fields:
              - name: video
                label: Hero video
                widget: file
                required: false
                hint: Optional. Selectable in either language editor. When filled, the video replaces all hero image-composition fields below.
              - name: video_poster
                label: Video preview image
                widget: image
                required: false
                hint: Selectable in either language editor. Shown before the hero video loads. Used only when Hero video is filled.
              - name: show_details
                label: Show compact facts in hero
                widget: boolean
                required: false
                default: false
                hint: Displays compact date, time, location, and price below the hero introduction.
              - name: main_image
                label: Main hero image
                widget: image
                required: false
                hint: Editable in either language editor. Large image in image mode. Ignored when Hero video is filled.
              - name: main_image_focus
                label: Main hero image focal point
                widget: select
                default: center
                hint: Controls the visible crop without changing the uploaded image.
                options:
                  - label: Center
                    value: center
                  - label: Top
                    value: top
                  - label: Bottom
                    value: bottom
                  - label: Left
                    value: left
                  - label: Right
                    value: right
                  - label: Top left
                    value: top-left
                  - label: Top right
                    value: top-right
                  - label: Bottom left
                    value: bottom-left
                  - label: Bottom right
                    value: bottom-right
              - name: inset_image
                label: Smaller inset image
                widget: image
                required: false
                hint: Editable in either language editor. Smaller overlapping image in image mode. Ignored when Hero video is filled.
              - name: inset_image_focus
                label: Inset hero image focal point
                widget: select
                default: center
                hint: Controls the visible crop without changing the uploaded image.
                options:
                  - label: Center
                    value: center
                  - label: Top
                    value: top
                  - label: Bottom
                    value: bottom
                  - label: Left
                    value: left
                  - label: Right
                    value: right
                  - label: Top left
                    value: top-left
                  - label: Top right
                    value: top-right
                  - label: Bottom left
                    value: bottom-left
                  - label: Bottom right
                    value: bottom-right
          - name: description
            label: Workshop description
            widget: object
            collapsed: true
            required: false
            fields:
              - name: show_info
                label: Show facts card beside description
                widget: boolean
                default: true
                hint: Places the central facts in a card in the right column.
          - name: image_band
            label: Image and text band
            widget: object
            collapsed: true
            required: false
            fields:
              - name: image
                label: Band image
                widget: image
                required: false
                hint: Editable in either language editor. Large image displayed beside the text.
              - name: image_focus
                label: Band image focal point
                widget: select
                default: center
                hint: Controls the visible crop without changing the uploaded image.
                options:
                  - label: Center
                    value: center
                  - label: Top
                    value: top
                  - label: Bottom
                    value: bottom
                  - label: Left
                    value: left
                  - label: Right
                    value: right
                  - label: Top left
                    value: top-left
                  - label: Top right
                    value: top-right
                  - label: Bottom left
                    value: bottom-left
                  - label: Bottom right
                    value: bottom-right
          - name: meta
            label: Advanced SEO and social sharing
            widget: object
            collapsed: true
            required: false
            hint: Optional overrides. Leave fields empty to use the canonical workshop title, card summary, and hero image.
            fields:
              - name: og_image
                label: Social sharing image override
                widget: image
                required: false
                hint: 'Recommended size: 1200 x 630 px. Defaults to the main hero image.'
              - name: og_image_width
                label: Social image width in pixels
                widget: number
                required: false
                value_type: int
                hint: 'Example: 1200.'
              - name: og_image_height
                label: Social image height in pixels
                widget: number
                required: false
                value_type: int
                hint: 'Example: 630.'
        i18n: false
      - name: title
        label: Workshop title
        widget: string
        hint: 'Example: Cellular Touch. Used on the programme card, in navigation, and as the default hero and SEO title.'
        i18n: true
      - name: registration
        label: Registration action
        widget: object
        collapsed: true
        fields:
          - name: label
            label: Registration button text
            widget: string
            hint: 'Example: Register now.'
          - name: note
