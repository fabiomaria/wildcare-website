        fields:
          - name: label
            label: Section label
            widget: string
            required: false
            hint: 'Example: The Practice.'
          - name: heading
            label: Description heading
            widget: string
            required: false
            hint: 'Example: Touch as cellular space.'
          - name: body
            label: Formatted description
            widget: richtext
            required: false
            modes:
              - rich_text
            buttons:
              - bold
              - italic
              - link
            editor_components: []
            use_markdown_shortcuts: false
            hint: Main workshop description shown in the left column. Use paragraphs, bold, italic, and links; the frontend applies the Wild Care typography.
          - name: info_title
            label: Facts-card title override
            widget: string
            required: false
            hint: 'Example: At a Glance. Leave empty to use the site default.'
        i18n: true
      - name: research
        label: Research cards
        widget: object
        collapsed: true
        required: false
        fields:
          - name: label
            label: Section label
            widget: string
            required: false
            hint: 'Example: Research Fields.'
          - name: heading
            label: Section heading
            widget: string
            required: false
            hint: 'Example: What we explore.'
          - name: fields
            label: Research cards
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.number}} - {{fields.title}}'
            required: false
            fields:
              - name: number
                label: Card number or eyebrow
                widget: string
                hint: 'Example: 01 or Week 1.'
              - name: title
                label: Card title
                widget: string
                hint: 'Example: Membrane.'
              - name: text
                label: Card description
                widget: text
                hint: 'Example: Sensing stability and flexibility from within.'
              - name: highlighted
                label: Highlight this card
                widget: boolean
                required: false
                default: false
                hint: Adds the accent border. Usually only one card should be highlighted.
        i18n: true
      - name: image_band
        label: Image and text band
        widget: object
        collapsed: true
        required: false
        fields:
          - name: label
            label: Section label
            widget: string
            required: false
            hint: 'Example: Flowing in / Flowing out.'
          - name: heading
            label: Section heading
            widget: string
            required: false
            hint: 'Example: A dancing boundary.'
          - name: body
            label: Formatted supporting text
            widget: richtext
            required: false
            modes:
              - rich_text
            buttons:
              - bold
              - italic
              - link
            editor_components: []
            use_markdown_shortcuts: false
            hint: Supporting text shown beside the image. Use paragraphs, bold, italic, and links; the frontend applies the Wild Care typography.
          - name: alt
            label: Band image description
            widget: string
            required: false
            hint: 'Example: A group researching movement through touch.'
        i18n: true
      - name: closing_cta
        label: Final registration call to action
        widget: object
        collapsed: true
        required: false
        hint: Optional moss-green registration band shown after the workshop content.
        fields:
          - name: heading
            label: CTA heading
            widget: string
            required: false
            hint: 'Example: Ready to join us?'
          - name: text
            label: CTA supporting text
            widget: text
            required: false
            hint: 'Example: Reserve your place for this workshop in Graz.'
          - name: button_label
            label: CTA button text override
            widget: string
            required: false
            hint: Leave empty to use the main registration button text.
        i18n: true
      - name: facilitators
        label: Facilitators and quotes
        widget: object
        collapsed: true
        required: false
        fields:
          - name: label
            label: Facilitator label
            widget: string
            required: false
            hint: 'Example: Facilitator or Teaching team.'
          - name: heading
            label: Section heading
            widget: string
            required: false
            hint: 'Example: Who guides the workshop. Leave empty for the compact layout.'
          - name: members
            label: Facilitators
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}}'
            required: false
            fields:
              - name: name
                label: Full name
                widget: string
                hint: 'Example: Valentyn Korotkevych. Shared between languages.'
              - name: image
                label: Portrait image
                widget: image
                hint: Editable in either language editor.
              - name: image_focus
                label: Portrait focal point
                widget: select
                default: center
                hint: Controls the visible crop without changing the uploaded image.
                options:
                  - label: Center
                    value: center
                  - label: Top
                    value: top
                  - label: Bottom
                    value: bottom
                  - label: Left
                    value: left
                  - label: Right
                    value: right
                  - label: Top left
                    value: top-left
                  - label: Top right
                    value: top-right
                  - label: Bottom left
                    value: bottom-left
                  - label: Bottom right
                    value: bottom-right
              - name: alt
                label: Portrait image description
                widget: string
                hint: 'Example: Portrait of Valentyn Korotkevych.'
              - name: role
                label: Role or expertise
                widget: string
                hint: 'Example: Contact Improvisation - Somatic research.'
              - name: bio
                label: Biography
                widget: text
                hint: 'Example: Two to five sentences about the facilitator and their practice.'
          - name: quotes
            label: Quotes beside facilitators
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.author}}'
            required: false
            hint: Optional quote cards shown in the right column beside facilitators.
            fields:
              - name: quote
                label: Quote text
                widget: text
                hint: 'Example: When we pay attention to tiny gestures, new pathways appear.'
              - name: author
                label: Quote author
                widget: string
                hint: 'Example: Valentyn Korotkevych. Shared between languages.'
        i18n: true
      - name: faq
        label: Frequently asked questions
        widget: object
        collapsed: true
        required: false
        fields:
          - name: label
            label: Section label
            widget: string
            required: false
            hint: 'Example: FAQ. Leave empty to use the site default.'
          - name: heading
            label: Section heading
            widget: string
            required: false
            hint: 'Example: Good to know.'
          - name: items
            label: Questions and answers
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.q}}'
            required: false
            fields:
              - name: q
                label: Question
                widget: string
                hint: 'Example: Do I need previous experience?'
              - name: a
                label: Answer
                widget: text
                hint: 'Example: No previous experience is required.'
        i18n: true
      - name: meta
        label: Advanced SEO and social sharing
        widget: object
        collapsed: true
        required: false
        hint: Optional overrides. Leave fields empty to use the canonical workshop title, card summary, and hero image.
        fields:
          - name: title
            label: Browser title override
            widget: string
            required: false
            hint: 'Example: Cellular Touch with Valentyn Korotkevych | Wild Care.'
          - name: description
            label: Search description override
            widget: text
            required: false
            hint: 'Example: A 150-160 character summary for search results.'
          - name: og_title
            label: Social sharing title override
            widget: string
            required: false
            hint: 'Example: Cellular Touch with Valentyn Korotkevych.'
          - name: og_description
            label: Social sharing description override
            widget: text
            required: false
            hint: 'Example: A short description for link previews.'
          - name: og_image_alt
            label: Social image description
            widget: string
            required: false
            hint: Describe what is visible in the social image.
        i18n: true
    i18n:
      structure: single_file
      locales:
        - en
        - de
      default_locale: en
      initial_locales: default
    filter:
      field: global.primary_locale
      value: en
  - name: venues
    label: Venues
    folder: content/venues
    create: true
    extension: yaml
    format: yaml
    identifier_field: global.id
    fields:
      - name: schema_version
        label: Schema version
        widget: hidden
        default: 2
      - name: global
        label: Venue details
        widget: object
        fields:
          - name: id
            label: Stable ID
            widget: string
            hint: 'Lowercase, no spaces — used in URLs and to link workshops/events to this venue. Example: orpheumgasse. Never rename after publishing.'
          - name: name
            label: Venue name
            widget: string
            hint: 'Shown on calendar entries and add-to-calendar links, not the workshop or event title. Example: Orpheumgasse Studio.'
          - name: street
            label: Street and number
            widget: string
            hint: 'Example: Orpheumgasse 11.'
          - name: postal_code
            label: Postal code
            widget: string
            hint: 'Example: 8010.'
          - name: city
            label: City
            widget: string
            hint: 'Example: Graz.'
          - name: country
            label: Country code
            widget: string
            default: AT
            hint: 'Two-letter ISO country code. Example: AT for Austria.'
          - name: geo_lat
            label: Latitude
            widget: number
            required: false
            hint: Optional. Improves map/search accuracy.
          - name: geo_lng
            label: Longitude
            widget: number
            required: false
            hint: Optional. Improves map/search accuracy.
          - name: url
            label: Venue website
            widget: string
            required: false
            hint: Optional link to the venue's own website, if it has one.
  - name: events
    label: Events
    folder: content/events
    create: true
    extension: yaml
    format: yaml
    identifier_field: global.id
    fields:
      - name: schema_version
        widget: hidden
        default: 2
      - name: global
        widget: object
        fields:
          - name: id
            widget: string
          - name: intended_locales
            widget: select
            multiple: true
            options:
              - de
              - en
          - name: status
            widget: select
            options:
              - draft
              - upcoming
              - current
              - past
              - unlisted
          - name: route
            widget: string
          - name: event_type
            widget: select
            options:
              - jam
              - performance
              - talk
              - retreat
              - other
          - name: page_mode
            widget: select
            options:
              - minimal
              - full
          - name: venue
            label: Venue
            widget: relation
            collection: venues
            search_fields:
              - global.name
            value_field: global.id
            display_fields:
              - global.name
            hint: Pick from the Venues collection. Shows the venue name, not its internal ID.
            required: false
          - name: start_at
            label: Start date for sorting
            widget: datetime
            required: false
          - name: updated_at
            label: Last updated
            widget: datetime
            required: false
          - name: sort_order
            label: Sort order when dates match
            widget: number
            required: false
            value_type: int
          - name: registration
            label: Registration
            widget: object
            required: false
            fields:
              - name: url
                label: Registration link
                widget: string
                required: false
              - name: availability
                label: Availability
                widget: select
                options:
                  - available
                  - sold_out
                  - waitlist
                  - unavailable
          - name: schedule
            label: Structured schedule (calendar, JSON-LD, .ics)
            widget: object
            hint: Drives the add-to-calendar links, search-engine event markup, and the sitewide upcoming-events lists.
            fields:
              - name: event_status
                label: Schedule status
                widget: select
                options:
                  - label: Scheduled
                    value: scheduled
                  - label: Cancelled
                    value: cancelled
                  - label: Postponed (new date not yet set)
                    value: postponed
                  - label: Rescheduled (new date set below)
                    value: rescheduled
                  - label: Moved online
                    value: moved_online
                default: scheduled
              - name: previous_start_local
                label: Original start time (only if rescheduled)
                widget: string
                required: false
                hint: 'Leave empty unless Schedule status is Rescheduled. Format: YYYY-MM-DDTHH:mm, local time, no timezone letter. Example: 2026-10-02T19:00.'
              - name: mode
                label: Schedule type
                widget: select
                options:
                  - label: Dates — one or more specific sessions
                    value: dates
                  - label: Recurring — a repeating weekly class
                    value: recurring
                default: dates
                hint: Events are almost always Dates mode — Recurring is for an ongoing weekly class like Montagskurs.
              - name: sessions
                label: Sessions (Dates mode only)
                widget: list
                required: false
                hint: One entry per session. A one-off event usually has exactly one.
                fields:
                  - name: id
                    label: Session ID
                    widget: string
                    hint: A short stable slug, e.g. eve. Never rename after publishing.
                  - name: start_local
                    label: Start
                    widget: string
                    hint: 'Local wall-clock time, no timezone. Format: YYYY-MM-DDTHH:mm. Example: 2026-06-21T18:00.'
                  - name: end_local
                    label: End
                    widget: string
                    hint: 'Local wall-clock time, no timezone. Format: YYYY-MM-DDTHH:mm. Example: 2026-06-21T22:00.'
                  - name: status
                    label: Status override for this session only
                    widget: select
                    required: false
                    hint: Leave empty to use the overall Schedule status above.
                    options:
                      - label: Scheduled
                        value: scheduled
                      - label: Cancelled
                        value: cancelled
                      - label: Postponed
                        value: postponed
                      - label: Rescheduled
                        value: rescheduled
                      - label: Moved online
                        value: moved_online
              - name: recurrence
                label: Weekly recurrence (Recurring mode only)
                widget: object
                required: false
                fields:
                  - name: weekday
                    label: Day of the week
                    widget: select
                    options:
                      - label: Monday
                        value: monday
                      - label: Tuesday
                        value: tuesday
                      - label: Wednesday
                        value: wednesday
                      - label: Thursday
                        value: thursday
                      - label: Friday
                        value: friday
                      - label: Saturday
                        value: saturday
                      - label: Sunday
                        value: sunday
                  - name: start_time
                    label: Start time
                    widget: string
                    hint: '24-hour clock, no seconds. Example: 17:45.'
                  - name: end_time
                    label: End time
                    widget: string
                    hint: '24-hour clock, no seconds. Example: 19:15.'
                  - name: anchor
                    label: First occurrence date
                    widget: string
                    hint: 'Format: YYYY-MM-DD. Example: 2026-01-05.'
                  - name: horizon_months
                    label: Show occurrences this many months ahead
                    widget: number
                    value_type: int
                    hint: Does not limit the calendar subscription feed, which is unbounded.
                  - name: except
                    label: Skipped dates (holidays, breaks)
                    widget: list
                    required: false
                    hint: 'Format: YYYY-MM-DD, one per entry.'
                    field:
                      name: date
                      label: Date
                      widget: string
              - name: featured_occurrences
                label: Special sessions (guest teacher, highlighted date)
                widget: list
                required: false
                hint: The date must match a real occurrence of the weekly pattern above.
                fields:
                  - name: id
                    label: Date
                    widget: string
                    hint: 'Format: YYYY-MM-DD. Example: 2026-11-16.'
                  - name: teacher
                    label: Guest teacher name
                    widget: string
                    required: false
      - name: locales
        label: Language content
        widget: object
        fields:
          - name: de
            label: German content
            widget: object
            required: false
            fields:
              - name: title
                label: Title
                widget: string
              - name: summary
                label: Summary
                widget: text
          - name: en
            label: English content
            widget: object
            required: false
            fields:
              - name: title
                label: Title
                widget: string
              - name: summary
                label: Summary
                widget: text
  - name: journal_bodies
    label: Journal bodies
    folder: content/journal/bodies
