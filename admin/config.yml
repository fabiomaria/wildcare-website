                  - global.name
                value_field: global.id
                display_fields:
                  - global.name
                hint: Pick from the Venues collection. Shows the venue name, not its internal ID.
                required: false
              - name: updated_at
                label: Last updated
                widget: datetime
                required: false
                hint: Bump this whenever the schedule below changes — it drives calendar-app update detection for the .ics subscription feed.
              - name: schedule
                label: Structured schedule (calendar, JSON-LD, .ics)
                widget: object
                required: false
                hint: Drives the add-to-calendar links, search-engine event markup, and the sitewide upcoming-events lists. Montagskurs is always a weekly Recurring schedule.
                fields:
                  - name: event_status
                    label: Schedule status
                    widget: select
                    options:
                      - label: Scheduled
                        value: scheduled
                      - label: Cancelled
                        value: cancelled
                      - label: Postponed (new date not yet set)
                        value: postponed
                      - label: Rescheduled (new date set below)
                        value: rescheduled
                      - label: Moved online
                        value: moved_online
                    default: scheduled
                  - name: previous_start_local
                    label: Original start time (only if rescheduled)
                    widget: string
                    required: false
                    hint: 'Leave empty unless Schedule status is Rescheduled. Format: YYYY-MM-DDTHH:mm.'
                  - name: mode
                    label: Schedule type
                    widget: hidden
                    default: recurring
                  - name: recurrence
                    label: Weekly recurrence
                    widget: object
                    fields:
                      - name: weekday
                        label: Day of the week
                        widget: select
                        options:
                          - label: Monday
