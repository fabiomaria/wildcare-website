# Wild Care — Sveltia CMS configuration
# Phase 0 draft: covers the schema-contract sample files only.
# Phase 2 adds the remaining pages; Phase 3 adds base_url (auth worker).

backend:
  name: github
  repo: fabiomaria/wildcare-website
  branch: html-site
  # base_url: <worker-auth URL>  — added in Phase 3 when the OAuth worker is deployed.
  # Until then, use the local-repository workflow (Chrome) or a PAT to sign in.

media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 10485760 # 10 MB hard stop; GitHub backend has no LFS
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

i18n:
  # Applies to entry (folder) collections, i.e. the journal:
  # warum-ci.md (DE) + warum-ci.en.md (EN, optional).
  # File collections without a {{locale}} placeholder use single_file
  # (top-level de:/en: keys) regardless of this structure setting.
  structure: multiple_files
  omit_default_locale_from_file_path: true
  locales: [de, en]
  default_locale: de
  initial_locales: [de]

collections:
  - name: seiten
    label: Seiten
    i18n: true
    files:
      - name: startseite
        label: Startseite
        file: content/pages/index.yaml
        i18n: true
        fields:
          - name: meta
            label: 'SEO & Vorschau'
            widget: object
            i18n: false
            fields:
              - { name: title, label: Seitentitel, widget: string }
              - { name: description, label: Beschreibung, widget: text }
          - name: hero
            label: Hero (Video)
            widget: object
            i18n: true
            fields:
              - { name: heading, label: 'Überschrift', widget: string, i18n: true, hint: 'Zeilenumbruch mit <br> möglich' }
              - { name: tagline, label: Untertitel, widget: text, i18n: true }
              - { name: cta_primary, label: 'Button: Komm vorbei', widget: string, i18n: true }
              - { name: cta_secondary, label: 'Button: Mehr erfahren', widget: string, i18n: true }
              - { name: cta_ghost, label: 'Button: Mitglied werden', widget: string, i18n: true }
          - name: event_banner
            label: Termin-Banner
            widget: object
            i18n: true
            fields:
              - { name: tag, label: Tag-Label, widget: string, i18n: true }
              - { name: day, label: Wochentag, widget: string, i18n: true }
              - { name: time, label: Uhrzeit, widget: string, i18n: false }
              - { name: address, label: Adresse, widget: string, i18n: false }
              - { name: basis, label: Basis (Spende), widget: string, i18n: true }
          - name: values
            label: Vier Haltungen
