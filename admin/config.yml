                label: Heading
                widget: string
              - name: text
                label: Text
                widget: text
              - name: first_name_label
                label: First-name field label
                widget: string
                hint: 'Example: First name.'
              - name: first_name_placeholder
                label: First-name placeholder
                widget: string
                hint: 'Example: Your first name.'
              - name: email_label
                label: Email field label
                widget: string
                hint: 'Example: Email address.'
              - name: email_placeholder
                label: Email placeholder
                widget: string
                hint: 'Example: you@example.com.'
              - name: submit
                label: Submit button text
                widget: string
              - name: submitting
                label: Submitting button text
                widget: string
                hint: 'Example: Signing you up ...'
              - name: submitted
