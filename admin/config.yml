            i18n: true
          - name: meta
            label: Advanced SEO and social sharing (review last)
            widget: object
            collapsed: true
            fields:
              - name: title
                label: Browser and SEO title
                widget: string
              - name: description
                label: Description
                widget: text
              - name: og_title
                label: Social sharing title override
                widget: string
                required: false
                hint: Leave empty to use the browser and SEO title.
              - name: og_description
                label: Social sharing description override
                widget: text
                required: false
                hint: Leave empty to use the SEO description.
              - name: og_image_alt
                label: Social image description
                widget: string
                required: false
                hint: Describe what is visible in the custom image. Required when a custom social image is used.
            i18n: true
        i18n: true
