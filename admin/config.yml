        i18n: false
        options:
          - { label: German only, value: de_only }
          - { label: English only, value: en_only }
          - { label: German and English, value: bilingual }
        default: de_only
        hint: 'Choose which translations are actually available for this workshop detail page.'
      - name: status
        label: Workshop status
        widget: select
        options:
          - { label: Draft - hidden everywhere, value: draft }
          - { label: Upcoming - shown in programme, value: upcoming }
          - { label: Current - shown in programme, value: current }
          - { label: Past - detail page remains available, value: past }
        default: upcoming
        i18n: false
      - { name: detail_page, label: Publish detail page, widget: boolean, default: true, i18n: false, hint: 'Requires a workshop title, hero content, and at least one content section.' }
      - { name: start_date, label: Start date for sorting, widget: datetime, i18n: false, hint: 'Used to order programme cards. This date is not displayed; enter the visible date under Core workshop facts.' }
      - { name: sort_order, label: Sort order when dates match, widget: number, required: false, value_type: int, i18n: false, hint: 'Example: 1 appears before 2 when two workshops have the same start date.' }
      - { name: registration_url, label: Registration link, widget: string, i18n: false, hint: 'Example: https://tally.so/r/ABC123. Used by every registration button.' }

      # Canonical content
      - { name: title, label: Workshop title, widget: string, i18n: true, hint: 'Example: Cellular Touch. Used on the programme card, in navigation, and as the default hero and SEO title.' }
      - name: registration
        label: Registration action
        widget: object
        collapsed: true
        i18n: true
        fields:
          - { name: label, label: Registration button text, widget: string, i18n: true, hint: 'Example: Register now.' }
          - { name: note, label: Note below the hero button, widget: text, required: false, i18n: true, hint: 'Example: Limited to 20 participants. Leave empty when no note is needed.' }
      - name: facts
        label: Core workshop facts
        widget: object
        collapsed: true
        i18n: true
        fields:
          - { name: date, label: Compact date, widget: string, required: false, i18n: true, hint: 'Example: 8-9 August 2026. Shown on the programme card and optionally in the hero.' }
          - { name: time, label: Compact time, widget: string, required: false, i18n: true, hint: 'Example: 10:00-18:00. Shown only in the optional hero facts.' }
          - { name: location, label: Location, widget: string, required: false, i18n: true, hint: 'Example: Orpheumgasse 11, 8010 Graz. Used in all fact summaries.' }
          - { name: price, label: Compact price, widget: string, required: false, i18n: true, hint: 'Example: EUR 70-120 sliding scale. Shown on the programme card and optionally in the hero.' }
          - { name: duration, label: Duration, widget: string, required: false, i18n: true, hint: 'Example: Two days. Shown on the programme card.' }
          - name: format
            label: What participants will do
            widget: list
            required: false
            i18n: true
            hint: 'Displayed in the What row of the facts card. Example entries: Contact Improvisation; Somatic research.'
            field: { name: value, label: Format entry, widget: string, hint: 'Example: Contact Improvisation and somatic research.' }
          - name: schedule
            label: Detailed schedule
            widget: list
            required: false
            i18n: true
            hint: 'Displayed in the When row of the facts card.'
            field: { name: value, label: Schedule line, widget: string, hint: 'Example: Saturday, 10:00-13:00 and 14:30-17:30.' }
          - name: price_details
            label: Detailed pricing
            widget: list
            required: false
            i18n: true
            hint: 'Displayed in the Price row of the facts card instead of the compact price.'
            field: { name: value, label: Price line, widget: string, hint: 'Example: Reduced EUR 70; Regular EUR 120.' }

      # Programme listing
      - name: card
        label: Programme card
        widget: object
        collapsed: true
        i18n: true
        fields:
          - name: tags
            label: Category tags
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.label}}'
            required: false
            i18n: true
            fields:
              - { name: label, label: Tag text, widget: string, i18n: true, hint: 'Example: Guest workshop.' }
              - name: style
                label: Tag colour
                widget: select
                options:
                  - { label: Neutral, value: default }
                  - { label: Green, value: moss }
                default: default
                i18n: true
          - { name: subtitle, label: Card subtitle, widget: string, required: false, i18n: true, hint: 'Example: With Valentyn Korotkevych.' }
          - { name: summary, label: Card summary, widget: text, required: false, i18n: true, hint: 'Example: A two-day Contact Improvisation workshop exploring touch, fascia, and momentum.' }
          - { name: detail_label, label: Detail-page button text, widget: string, required: false, i18n: true, hint: 'Example: Learn more. Leave empty to use the site default.' }

      # Detail-page hero
      - name: hero
        label: Page hero
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: badge, label: Hero category badge, widget: string, required: false, i18n: true, hint: 'Example: Guest Workshop - Contact Improvisation.' }
          - { name: headline, label: Hero headline override, widget: string, required: false, i18n: true, hint: 'Example: Contact Improvisation. Leave empty to use the Workshop title.' }
          - { name: headline_accent, label: Coloured second headline line, widget: string, required: false, i18n: true, hint: 'Example: with Valentyn Korotkevych. This line appears below the main headline.' }
          - { name: subtitle, label: Hero introduction, widget: text, required: false, i18n: true, hint: 'Example: A somatic workshop moving from touch through falling into shared movement.' }
          - { name: video, label: Hero video, widget: file, required: false, i18n: true, hint: 'Optional. When filled, the video replaces all hero image-composition fields below.' }
          - { name: video_poster, label: Video preview image, widget: image, required: false, i18n: true, hint: 'Shown before the hero video loads. Used only when Hero video is filled.' }
          - { name: show_details, label: Show compact facts in hero, widget: boolean, required: false, default: false, i18n: duplicate, hint: 'Displays compact date, time, location, and price below the hero introduction.' }
          - { name: visual_aria, label: Image composition accessibility label, widget: string, required: false, i18n: true, hint: 'Example: Participants practising Contact Improvisation. Ignored when Hero video is filled.' }
          - { name: main_image, label: Main hero image, widget: image, required: false, i18n: true, hint: 'Large image in image mode. Ignored when Hero video is filled.' }
          - { name: main_alt, label: Main image description, widget: string, required: false, i18n: true, hint: 'Example: Two dancers sharing weight in a lift. Ignored when Hero video is filled.' }
          - { name: inset_image, label: Smaller inset image, widget: image, required: false, i18n: true, hint: 'Smaller overlapping image in image mode. Ignored when Hero video is filled.' }
          - { name: inset_alt, label: Inset image description, widget: string, required: false, i18n: true, hint: 'Example: Three participants researching touch. Ignored when Hero video is filled.' }
          - { name: note_title, label: Image note title, widget: string, required: false, i18n: true, hint: 'Example: Cellular Touch. Ignored when Hero video is filled.' }
          - { name: note_text, label: Image note text, widget: text, required: false, i18n: true, hint: 'Example: The membrane becomes a dancing boundary. Ignored when Hero video is filled.' }

      # Workshop description and facts card
      - name: description
        label: Workshop description
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, required: false, i18n: true, hint: 'Example: The Practice.' }
          - { name: heading, label: Description heading, widget: string, required: false, i18n: true, hint: 'Example: Touch as cellular space.' }
          - name: paragraphs
            label: Description paragraphs
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            i18n: true
            hint: 'Main workshop description shown in the left column.'
            field: { name: text, label: Paragraph, widget: text, hint: 'Example: Describe one aspect of the workshop practice in two to four sentences.' }
          - { name: show_info, label: Show facts card beside description, widget: boolean, default: true, i18n: duplicate, hint: 'Places the central facts in a card in the right column.' }
          - { name: info_title, label: Facts-card title override, widget: string, required: false, i18n: true, hint: 'Example: At a Glance. Leave empty to use the site default.' }

      # Optional content sections
      - name: research
        label: Research cards
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, required: false, i18n: true, hint: 'Example: Research Fields.' }
          - { name: heading, label: Section heading, widget: string, required: false, i18n: true, hint: 'Example: What we explore.' }
          - name: fields
            label: Research cards
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.number}} - {{fields.title}}'
            required: false
            i18n: true
            fields:
              - { name: number, label: Card number or eyebrow, widget: string, i18n: true, hint: 'Example: 01 or Week 1.' }
              - { name: title, label: Card title, widget: string, i18n: true, hint: 'Example: Membrane.' }
              - { name: text, label: Card description, widget: text, i18n: true, hint: 'Example: Sensing stability and flexibility from within.' }
              - { name: highlighted, label: Highlight this card, widget: boolean, required: false, default: false, i18n: true, hint: 'Adds the accent border. Usually only one card should be highlighted.' }
      - name: image_band
        label: Image and text band
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, required: false, i18n: true, hint: 'Example: Flowing in / Flowing out.' }
          - { name: heading, label: Section heading, widget: string, required: false, i18n: true, hint: 'Example: A dancing boundary.' }
          - { name: text, label: Supporting text, widget: text, required: false, i18n: true, hint: 'Example: Holding together is not holding on.' }
          - { name: image, label: Band image, widget: image, required: false, i18n: true, hint: 'Large image displayed beside the text.' }
          - { name: alt, label: Band image description, widget: string, required: false, i18n: true, hint: 'Example: A group researching movement through touch.' }
      - name: facilitators
        label: Facilitators and quotes
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: label, label: Facilitator label, widget: string, required: false, i18n: true, hint: 'Example: Facilitator or Teaching team.' }
          - { name: heading, label: Section heading, widget: string, required: false, i18n: true, hint: 'Example: Who guides the workshop. Leave empty for the compact layout.' }
          - name: members
            label: Facilitators
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}}'
            required: false
            i18n: true
            fields:
              - { name: name, label: Full name, widget: string, i18n: duplicate, hint: 'Example: Valentyn Korotkevych. Shared between languages.' }
              - { name: image, label: Portrait image, widget: image, i18n: duplicate, hint: 'Shared between languages.' }
              - { name: alt, label: Portrait image description, widget: string, i18n: true, hint: 'Example: Portrait of Valentyn Korotkevych.' }
              - { name: role, label: Role or expertise, widget: string, i18n: true, hint: 'Example: Contact Improvisation - Somatic research.' }
              - { name: bio, label: Biography, widget: text, i18n: true, hint: 'Example: Two to five sentences about the facilitator and their practice.' }
          - name: quotes
            label: Quotes beside facilitators
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.author}}'
            required: false
            i18n: true
            hint: 'Optional quote cards shown in the right column beside facilitators.'
            fields:
              - { name: quote, label: Quote text, widget: text, i18n: true, hint: 'Example: When we pay attention to tiny gestures, new pathways appear.' }
              - { name: author, label: Quote author, widget: string, i18n: duplicate, hint: 'Example: Valentyn Korotkevych. Shared between languages.' }
      - name: faq
        label: Frequently asked questions
        widget: object
        collapsed: true
        required: false
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, required: false, i18n: true, hint: 'Example: FAQ. Leave empty to use the site default.' }
          - { name: heading, label: Section heading, widget: string, required: false, i18n: true, hint: 'Example: Good to know.' }
          - name: items
            label: Questions and answers
            widget: list
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.q}}'
            required: false
            i18n: true
            fields:
              - { name: q, label: Question, widget: string, i18n: true, hint: 'Example: Do I need previous experience?' }
              - { name: a, label: Answer, widget: text, i18n: true, hint: 'Example: No previous experience is required.' }

      # Advanced metadata overrides
      - name: meta
        label: Advanced SEO and social sharing
        widget: object
        collapsed: true
        required: false
        i18n: true
        hint: 'Optional overrides. Leave fields empty to use the canonical workshop title, card summary, and hero image.'
        fields:
          - { name: title, label: Browser title override, widget: string, required: false, i18n: true, hint: 'Example: Cellular Touch with Valentyn Korotkevych | Wild Care.' }
          - { name: description, label: Search description override, widget: text, required: false, i18n: true, hint: 'Example: A 150-160 character summary for search results.' }
          - { name: og_title, label: Social sharing title override, widget: string, required: false, i18n: true, hint: 'Example: Cellular Touch with Valentyn Korotkevych.' }
          - { name: og_description, label: Social sharing description override, widget: text, required: false, i18n: true, hint: 'Example: A short description for link previews.' }
          - { name: og_image, label: Social sharing image override, widget: image, required: false, i18n: true, hint: 'Recommended size: 1200 x 630 px. Defaults to the main hero image.' }
          - { name: og_image_alt, label: Social image description, widget: string, required: false, i18n: true, hint: 'Describe what is visible in the social image.' }
          - { name: og_image_width, label: Social image width in pixels, widget: number, required: false, value_type: int, i18n: true, hint: 'Example: 1200.' }
          - { name: og_image_height, label: Social image height in pixels, widget: number, required: false, value_type: int, i18n: true, hint: 'Example: 630.' }
