# Wild Care — Sveltia CMS configuration
# Phase 0 draft: covers the schema-contract sample files only.
# Phase 2 adds the remaining pages; Phase 3 adds base_url (auth worker).

backend:
  name: github
  repo: fabiomaria/wildcare-website
  branch: production
  base_url: https://wildcare-cms-auth.fabiogerhold.workers.dev

media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 10485760 # 10 MB hard stop; GitHub backend has no LFS
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true

i18n:
  # Applies to entry (folder) collections, i.e. the journal:
  # warum-ci.md (DE) + warum-ci.en.md (EN, optional).
  # File collections without a {{locale}} placeholder use single_file
  # (top-level de:/en: keys) regardless of this structure setting.
  structure: multiple_files
  omit_default_locale_from_file_path: true
  locales: [de, en]
  default_locale: de
  initial_locales: [de]

collections:
  - name: seiten
    label: 'Pages'
    i18n:
      structure: single_file
      locales: [de, en]
      default_locale: de
      initial_locales: [de]
    files:
      - name: startseite
        label: 'Homepage'
        file: content/pages/index.yaml
        i18n: true
        fields:
          - name: hero
            label: 'Video hero'
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { name: heading, label: 'Heading', widget: string, i18n: true, hint: 'Example: Movement as encounter. Use <br> for an intentional line break.' }
              - { name: tagline, label: 'Subtitle', widget: text, i18n: true }
              - { name: cta_primary, label: 'Visit button text', widget: string, i18n: true }
              - { name: cta_secondary, label: 'Learn more button text', widget: string, i18n: true }
              - { name: cta_ghost, label: 'Membership button text', widget: string, i18n: true }
          - name: event_banner
            label: 'Event banner'
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { name: tag, label: 'Optional event badge', widget: string, required: false, hint: 'Optional decorative text. Example: About us, Our values, or Next session.', i18n: true }
              - { name: day, label: 'Day label', widget: string, i18n: true }
              - { name: time, label: 'Time', widget: string, i18n: false }
              - { name: address, label: 'Address', widget: string, i18n: false }
              - { name: basis, label: 'Pricing / donation basis', widget: string, i18n: true }
          - name: values
            label: 'Four values'
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { name: label, label: 'Optional eyebrow label', widget: string, required: false, hint: 'Optional decorative text. Example: About us, Our values, or Next session.', i18n: true }
              - { name: heading, label: 'Heading', widget: string, i18n: true }
              - name: cards
                label: 'Cards'
                widget: list
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.title}}'
                i18n: true
                min: 4
                max: 4
                hint: 'Exactly four cards. Their icons are assigned to positions 1-4.'
                fields:
                  - { name: title, label: 'Title', widget: string, i18n: true }
                  - { name: text, label: Text, widget: text, i18n: true }
          - name: invitation
            label: 'Invitation section'
            widget: object
            collapsed: true
            i18n: true
            fields:
              - { name: label, label: 'Optional eyebrow label', widget: string, required: false, hint: 'Optional decorative text. Example: About us, Our values, or Next session.', i18n: true }
