backend:
  name: github
  repo: fabiomaria/wildcare-website
  branch: production
  base_url: https://wildcare-cms-auth.fabiogerhold.workers.dev
media_folder: assets/uploads
public_folder: /assets/uploads
i18n:
  structure: single_file
  locales:
    - de
    - en
  default_locale: de
  initial_locales: default
output:
  omit_empty_optional_fields: true
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 10485760
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
        svg:
          optimize: true
collections:
  - name: seiten
    label: Pages
    i18n: true
    files:
      - name: startseite
        label: Homepage
        file: content/pages/index.yaml
        fields:
          - name: schema_version
            label: Schema version
            widget: hidden
            default: 2
            i18n: false
          - name: global
            label: Shared settings
            widget: object
            collapsed: false
            fields:
              - name: id
                label: Stable ID
                widget: hidden
                default: index
              - name: status
                label: Status
                widget: select
                options:
                  - draft
                  - published
                  - unlisted
                default: published
              - name: route
                label: Canonical route
                widget: hidden
                default: /
              - name: meta
                label: Advanced SEO and social sharing (review last)
                widget: object
                collapsed: true
                fields:
                  - name: og_image
                    label: Social sharing image override
                    widget: image
                    required: false
                    hint: 'Recommended size: 1200 x 630 px. Leave empty to use the website default.'
                  - name: og_image_width
                    label: Social image width in pixels
                    widget: number
                    required: false
                    value_type: int
                    hint: Enter the custom image’s real pixel width.
                  - name: og_image_height
                    label: Social image height in pixels
                    widget: number
                    required: false
                    value_type: int
                    hint: Enter the custom image’s real pixel height.
            i18n: false
          - name: hero
            label: Video hero
            widget: object
            collapsed: true
            fields:
              - name: heading
                label: Heading
                widget: string
                hint: 'Example: Movement as encounter. Use <br> for an intentional line break.'
              - name: tagline
                label: Subtitle
                widget: text
              - name: show_cta_primary
                label: Show “Visit” button
                widget: boolean
                default: true
                i18n: false
                hint: Turn this off to temporarily hide the first button in the video hero. The button text and Tally form are kept for later.
              - name: cta_primary
                label: Visit button text
                widget: string
              - name: cta_primary_url
                label: Visit button link (optional)
                widget: string
                required: false
                i18n: false
                hint: Leave empty to open the existing Tally signup form. Enter a URL to turn this into a normal link.
              - name: show_cta_secondary
                label: Show “Learn more” button
                widget: boolean
                default: true
                i18n: false
              - name: cta_secondary
                label: Learn more button text
                widget: string
              - name: cta_secondary_url
                label: Learn more button link
                widget: string
                required: false
                i18n: false
                hint: Enter an internal path such as programm or an external URL.
              - name: show_cta_ghost
                label: Show “Membership” button
                widget: boolean
                default: true
                i18n: false
              - name: cta_ghost
                label: Membership button text
                widget: string
              - name: cta_ghost_url
                label: Membership button link
                widget: string
                required: false
                i18n: false
                hint: Enter an internal path such as mitmachen or an external URL.
            i18n: true
          - name: event_banner
            label: Event banner
            widget: object
            collapsed: true
            fields:
              - name: tag
                label: Optional event badge
                widget: string
                required: false
                hint: 'Optional decorative text. Example: About us, Our values, or Next session.'
              - name: day
                label: Day label
                widget: string
              - name: time
                label: Time
                widget: string
              - name: address
                label: Address
                widget: string
              - name: basis
                label: Pricing / donation basis
                widget: string
            i18n: true
          - name: values
            label: Four values
            widget: object
            collapsed: true
            fields:
              - name: label
                label: Optional eyebrow label
                widget: string
                required: false
                hint: 'Optional decorative text. Example: About us, Our values, or Next session.'
              - name: heading
                label: Heading
                widget: string
              - name: cards
                label: Cards
                widget: list
                collapsed: true
                minimize_collapsed: true
                summary: '{{fields.title}}'
                min: 4
                max: 4
                hint: Exactly four cards. Their icons are assigned to positions 1-4.
                fields:
                  - name: title
                    label: Title
                    widget: string
                  - name: text
                    label: Text
                    widget: text
            i18n: true
          - name: invitation
            label: Invitation section
            widget: object
            collapsed: true
            fields:
              - name: label
                label: Optional eyebrow label
                widget: string
                required: false
                hint: 'Optional decorative text. Example: About us, Our values, or Next session.'
              - name: heading
