  - name: journal
    label: Journal
    folder: content/journal
    create: true
    extension: md
    format: frontmatter
    i18n: true
    fields:
      - name: language_mode
        label: Sprachversionen
        widget: select
        options:
          - { label: Deutsch, value: de_only }
          - { label: Englisch, value: en_only }
          - { label: Deutsch + Englisch, value: bilingual }
        default: de_only
        i18n: duplicate
      - { name: title, label: Titel, widget: string, required: false, i18n: true }
      - { name: title_html, label: 'Artikeltitel mit optionalem <br>', widget: string, required: false, i18n: true }
      - { name: homepage_title, label: 'Titel auf der Startseite', widget: string, required: false, i18n: true }
      - { name: date, label: Datum, widget: datetime, i18n: duplicate }
      - { name: sort_order, label: Sortierung bei gleichem Datum, widget: number, required: false, value_type: int, i18n: duplicate }
      - { name: status, label: Status, widget: select, options: [published, coming_soon], default: published, i18n: duplicate }
      - { name: excerpt, label: Teaser, widget: text, required: false, i18n: true }
      - { name: homepage_excerpt, label: 'Kurz-Teaser auf der Startseite', widget: text, required: false, i18n: true }
      - { name: meta_description, label: SEO-Beschreibung, widget: text, required: false, i18n: true }
      - { name: image, label: Bild, widget: image, required: false, i18n: duplicate }
      - { name: image_alt, label: Alt-Text, widget: string, required: false, i18n: duplicate }
      - { name: homepage_image_alt, label: 'Alt-Text auf der Startseite', widget: string, required: false, i18n: duplicate }
      - { name: hero_image, label: Hero-Bild, widget: image, required: false, i18n: duplicate }
      - { name: hero_alt, label: Hero-Alt-Text, widget: string, required: false, i18n: duplicate }
      - { name: hero_variant, label: Hero-Darstellung, widget: select, options: [cover, contained], default: cover, i18n: duplicate }
      - { name: tally, label: Tally-Script laden, widget: boolean, required: false, default: false, i18n: duplicate }
      - name: cta
        label: Artikel-CTA
        widget: object
        required: false
        i18n: true
        fields:
          - { name: heading, label: Überschrift, widget: string, required: false, i18n: true }
          - { name: text, label: Text, widget: text, required: false, i18n: true }
          - name: buttons
            label: Buttons
            widget: list
            required: false
            i18n: true
            fields:
              - { name: label, label: Button-Text, widget: string, i18n: true }
              - { name: kind, label: Typ, widget: select, options: [link, tally], default: link, i18n: duplicate }
              - { name: style, label: Stil, widget: select, options: [primary, secondary], default: primary, i18n: duplicate }
              - { name: href, label: Link, widget: string, required: false, i18n: duplicate }
              - { name: tally_open, label: Tally-ID, widget: string, required: false, i18n: duplicate }
      - { name: body, label: Artikeltext, widget: markdown, required: false, i18n: true }

  - name: rechtliches
    label: Rechtliches (nur Deutsch)
    files:
      - name: impressum
        label: Impressum
        file: content/legal/impressum.md
        fields:
          - { name: title, label: Titel, widget: string }
          - { name: body, label: Text, widget: markdown }

  - name: workshops
    label: Workshops
    folder: content/workshops
    create: true
    extension: yaml
    format: yaml
    identifier_field: slug
    slug: '{{slug}}'
    fields:
      - { name: slug, label: Slug/URL, widget: string, hint: 'Beispiel: cellular-touch ergibt cellular-touch.html' }
      - name: language_mode
        label: Sprachversionen der Detailseite
        widget: select
        options:
          - { label: Deutsch, value: de_only }
          - { label: Englisch, value: en_only }
        default: de_only
      - { name: status, label: Status, widget: select, options: [draft, upcoming, current, past], default: upcoming }
      - { name: detail_page, label: Detailseite veröffentlichen, widget: boolean, default: true, hint: 'Die Seite wird erst gebaut, wenn SEO, Hero, Praxis-Intro und Info-Karte ausgefüllt sind; bis dahin erscheint nur die Programm-Karte.' }
      - { name: start_date, label: Startdatum, widget: datetime }
      - { name: sort_order, label: Sortierung bei gleichem Datum, widget: number, required: false, value_type: int }
      - { name: registration_url, label: Anmeldelink, widget: string }
      - name: de
        label: Deutsch
        widget: object
        required: false
        fields:
          - name: card
            label: Programm-Karte
            widget: object
            fields:
              - name: tags
                label: Tags
                widget: list
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: style, label: Stil, widget: select, options: [default, moss], default: default }
              - { name: title, label: Titel, widget: string, required: false }
              - { name: subtitle, label: Untertitel, widget: string, required: false }
              - { name: summary, label: Kurzbeschreibung, widget: text, required: false }
              - { name: date, label: Datumstext, widget: string, required: false }
              - { name: location, label: Ort, widget: string, required: false }
              - { name: price, label: Preis, widget: string, required: false }
              - { name: duration, label: Dauer, widget: string, required: false }
              - { name: register_label, label: Anmeldebutton, widget: string, required: false }
              - { name: detail_label, label: Detailbutton, widget: string, required: false }
          - name: meta
            label: SEO
            widget: object
            required: false
            fields:
              - { name: title, label: Seitentitel, widget: string, required: false }
              - { name: description, label: Beschreibung, widget: text, required: false }
              - { name: og_title, label: Social Title, widget: string, required: false }
              - { name: og_description, label: Social Beschreibung, widget: text, required: false }
              - { name: og_image, label: Social Bild, widget: image, required: false }
              - { name: og_image_width, label: Bildbreite, widget: number, required: false, value_type: int }
              - { name: og_image_height, label: Bildhöhe, widget: number, required: false, value_type: int }
          - name: nav
            label: Navigation
            widget: object
            required: false
            fields:
              - { name: breadcrumb, label: Breadcrumb, widget: string, required: false }
          - name: hero
            label: Hero
            widget: object
            required: false
            fields:
              - { name: badge, label: Badge, widget: string, required: false }
              - { name: heading, label: Überschrift, widget: string, required: false, hint: 'HTML wie <br> und <span> ist erlaubt.' }
              - { name: subtitle, label: Untertitel, widget: text, required: false }
              - { name: cta_label, label: Button, widget: string, required: false }
              - { name: visual_aria, label: Bildgruppe ARIA, widget: string, required: false }
              - { name: main_image, label: Hauptbild, widget: image, required: false }
              - { name: main_alt, label: Hauptbild Alt-Text, widget: string, required: false }
              - { name: inset_image, label: Nebenbild, widget: image, required: false }
              - { name: inset_alt, label: Nebenbild Alt-Text, widget: string, required: false }
              - { name: note_title, label: Bildnotiz Titel, widget: string, required: false }
              - { name: note_text, label: Bildnotiz Text, widget: text, required: false }
          - name: practice
            label: Praxis-Intro
            widget: object
            required: false
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: heading, label: Überschrift, widget: string, required: false }
              - name: paragraphs
                label: Absätze
                widget: list
                required: false
                field: { name: text, label: Absatz, widget: text }
          - name: info
            label: Info-Karte
            widget: object
            required: false
            fields:
              - { name: title, label: Titel, widget: string, required: false }
              - name: rows
                label: Zeilen
                widget: list
                required: false
                fields:
                  - { name: icon, label: Icon, widget: select, options: [plus, calendar, location, cost, clock, people], default: plus }
                  - { name: label, label: Label, widget: string }
                  - name: values
                    label: Werte
                    widget: list
                    field: { name: value, label: Wert, widget: string }
              - { name: cta_label, label: Button, widget: string, required: false }
          - name: research
            label: Forschungsfelder
            widget: object
            required: false
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: heading, label: Überschrift, widget: string, required: false }
              - name: fields
                label: Karten
                widget: list
                required: false
                fields:
                  - { name: number, label: Nummer, widget: string }
                  - { name: title, label: Titel, widget: string }
                  - { name: text, label: Text, widget: text }
                  - { name: highlighted, label: Hervorheben, widget: boolean, required: false, default: false }
          - name: image_band
            label: Bildband
            widget: object
            required: false
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: heading, label: Überschrift, widget: string, required: false }
              - { name: text, label: Text, widget: text, required: false }
              - { name: image, label: Bild, widget: image, required: false }
              - { name: alt, label: Alt-Text, widget: string, required: false }
          - name: facilitator
            label: Leitung
            widget: object
            required: false
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: name, label: Name, widget: string, required: false }
              - { name: image, label: Bild, widget: image, required: false }
              - { name: image_alt, label: Bild Alt-Text, widget: string, required: false }
              - { name: role, label: Rolle, widget: string, required: false }
              - { name: bio, label: Bio, widget: text, required: false }
          - name: testimonial
            label: Zitat
            widget: object
            required: false
            fields:
              - { name: quote, label: Zitat, widget: text, required: false }
              - { name: author, label: Autor:in, widget: string, required: false }
      - name: en
        label: English
        widget: object
        required: false
        fields:
          - name: card
            label: Programme card
            widget: object
            fields:
              - name: tags
                label: Tags
                widget: list
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: style, label: Style, widget: select, options: [default, moss], default: default }
              - { name: title, label: Title, widget: string, required: false }
              - { name: subtitle, label: Subtitle, widget: string, required: false }
              - { name: summary, label: Summary, widget: text, required: false }
              - { name: date, label: Date label, widget: string, required: false }
              - { name: location, label: Location, widget: string, required: false }
              - { name: price, label: Price, widget: string, required: false }
              - { name: duration, label: Duration, widget: string, required: false }
              - { name: register_label, label: Register button, widget: string, required: false }
              - { name: detail_label, label: Detail button, widget: string, required: false }
          - name: meta
            label: SEO
            widget: object
            required: false
            fields:
              - { name: title, label: Page title, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
              - { name: og_title, label: Social title, widget: string, required: false }
              - { name: og_description, label: Social description, widget: text, required: false }
              - { name: og_image, label: Social image, widget: image, required: false }
              - { name: og_image_width, label: Image width, widget: number, required: false, value_type: int }
              - { name: og_image_height, label: Image height, widget: number, required: false, value_type: int }
          - name: nav
