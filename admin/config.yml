            required: false
            fields:
              - { name: breadcrumb, label: Breadcrumb, widget: string, required: false }
          - name: hero
            label: Hero
            widget: object
            required: false
            fields:
              - { name: badge, label: Badge, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false, hint: 'HTML like <br> and <span> is allowed.' }
              - { name: subtitle, label: Subtitle, widget: text, required: false }
              - { name: cta_label, label: Button, widget: string, required: false }
              - { name: visual_aria, label: Image group ARIA, widget: string, required: false }
              - { name: main_image, label: Main image, widget: image, required: false }
              - { name: main_alt, label: Main image alt text, widget: string, required: false }
              - { name: inset_image, label: Inset image, widget: image, required: false }
