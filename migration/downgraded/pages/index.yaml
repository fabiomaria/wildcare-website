  values:
    label: Was uns leitet
    heading: Vier Haltungen
    cards:
      - title: Beziehung > Perfektion
        text: Nicht das fertige Werk zählt, sondern das, was zwischen uns passiert. Wie nehmen wir Raum? Wie geben wir Raum?
      - title: Mikro-Utopien
        text: Wir kreieren temporäre, sichere Räume. Hier setzen wir die Regeln der Welt kurz auf Pause und üben ein anderes Miteinander.
      - title: Forschendes Lernen
        text: Keine festen Formen zum Nachahmen. Wir geben Werkzeuge an die Hand, um den eigenen Ausdruck zu erforschen.
      - title: Radikale Fürsorge
        text: Nicht nur Sanftmut, sondern auch Klarheit. Eigene Grenzen wahren und anderen den Raum geben, gesehen zu werden.
  invitation:
    label: Labor für Zusammenleben
    heading: Was passiert bei uns?
    p1: Contact Improvisation ist das spielerische Forschen mit Schwerkraft, Gleichgewicht und Berührung. Es gibt keine festen Schritte, keinen Leistungsdruck und keine Rollen.
    p2: Du lernst, durch achtsamen Körperkontakt deinen Körper bewusster zu erleben, dein Nervensystem zu regulieren und Grenzen zu kommunizieren — im Tanz wie im Alltag.
    cta: Zum Montagskurs
  quote: Bei uns steht nicht das fertige Kunstwerk an der Wand oder die perfekte Pose auf der Bühne im Mittelpunkt, sondern das, was zwischen uns passiert.
  journal:
    heading: Aus dem Labor
    all_posts: Alle Beiträge
