en:
  meta:
    og_image: /assets/uploads/cover-1640x856-2.webp
    og_image_width: 1640
    og_image_height: 720
  hero:
    heading: We live the art<br>of encounter.
    tagline: Art as a living, social practice. Every Monday in Graz — open to everyone, donation-based.
    cta_primary: Join us
    cta_secondary: Learn more
    cta_ghost: Become a member
  event_banner:
    tag: Next Session
    day: Every Monday
    basis: Donation-based
  values:
    label: What guides us
    heading: Four Principles
    cards:
      - title: Relationship > Perfection
        text: It’s not the finished work that counts, but what happens between us. How do we take up space? How do we make space?
      - title: Micro-Utopias
        text: We create temporary, safe spaces. Here we pause the rules of the world for a moment and practise a different way of being together.
      - title: Inquiry-Based Learning
        text: No fixed forms to imitate. We offer tools to explore your own expression and discover what moves you.
      - title: Radical Care
        text: Not just gentleness, but also clarity. Holding your own boundaries while giving others the space to be seen.
  invitation:
    label: A Lab for Living Together
    heading: What happens here?
    p1: Contact Improvisation is the playful exploration of gravity, balance, and touch. There are no fixed steps, no pressure to perform, and no assigned roles.
    p2: Through mindful physical contact, you learn to experience your body more consciously, regulate your nervous system, and communicate boundaries — in dance and in everyday life.
    cta: To the Monday Class
  quote: For us, it’s not about the finished artwork on the wall or the perfect pose on stage — it’s about what happens between us.
