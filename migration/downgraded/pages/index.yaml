    og_image_alt: Contact Improvisation dancers sharing weight — Wild Care, Graz.
  hero:
    heading: Wir leben die Kunst<br>der Begegnung.
    tagline: Kunst als lebendige, soziale Praxis. Jeden Montag in Graz — offen für alle, auf Spendenbasis.
    cta_primary: Komm vorbei
    cta_secondary: Mehr erfahren
    cta_ghost: Mitglied werden
