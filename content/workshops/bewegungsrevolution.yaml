  research:
    label: Der Fahrplan
    heading: 6 Wochen, 6 Themen
    fields:
      - number: Woche 1 · 11. Mai
        title: Small Dance
        text: Die Schwerkraft spüren und bemerken, dass wir ständig von selbst in Bewegung sind — in einem Tanz mit der Schwerkraft. Der Boden ist dein erster Tanzpartner.
      - number: Woche 2 · 18. Mai
        title: Nicht fallen, sondern fließen
        text: "Yielding: die Kunst des Sich-Einlassens. Lernen, den Körper weich zu machen — alleine und zusammen. Der Körper, der weich werden kann, kann alles."
      - number: Woche 3 · 25. Mai
        title: Konsens und Lauschen
        text: Wie der Körper Ja und Nein sagt, bevor der Mund es tut. Üben, Nähe zu spüren, Grenzen zu kommunizieren und durch Berührung zuzuhören. Konsens ist das Gespräch, das du die ganze Zeit führst.
      - number: Woche 4 · 1. Juni
        title: Gewicht fließen lassen
        text: Gewicht gießen ist nicht Gewicht abladen. Von der Wand über Partner:in-Lehnen bis zum gemeinsamen Fallen — den Punkt finden, an dem keine:r sagen kann, wer wen trägt.
      - number: Woche 5 · 8. Juni
        title: Der rollende Kontaktpunkt
        text: "Das Kernstück von CI: der Punkt, an dem zwei Körper sich treffen, und wir lassen ihn wandern. Nicht lenken, sondern folgen. Der rollende Punkt ist das Gespräch selbst."
      - number: Woche 6 · 15. Juni
        title: Die Jam
        text: "Kein:e Lehrer:in ruft Übungen aus. Du wählst: alleine tanzen, mit jemandem tanzen, zuschauen, ausruhen. Die Jam ist dort, wo CI lebt — nur ein Raum, ein Boden und andere Menschen, die bereit sind, mit ihren Körpern zuzuhören."
        highlighted: true

  quote: Bewegung ist kein Luxusgut. Sie gehört allen. Wenn wir lernen, unseren Körper bewusst zu bewohnen, verändert das nicht nur den Tanz — sondern auch, wie wir einander begegnen.

  testimonials:
    label: Feedback
    heading: Was Teilnehmer:innen sagen
    items:
      - quote: „Ich habe durch den Kurs ein besseres Verständnis bekommen, was Contact Improvisation ist, auch mein Körper versteht mehr und ich kann meinen Körper in der tänzerischen Begegnung bewusster einsetzen. Und es macht einfach Freude!“
        author: Anna
      - quote: „Ich tanze schon länger, schau aber wenn ich Zeit habe sehr gerne im Kurs vorbei, da die positive, kreative Energie sich super anfühlt und ich jedesmal neue Anregungen bekomme, weiter zu probieren, Neues zu integrieren — macht einfach richtig lebendig und glücklich.“
        author: Iris

  team:
    label: Wer unterrichtet
    heading: Deine Begleiter:innen
    members:
      - name: Verena Eidenberger
        image: assets/images/verena.jpg
        alt: Verena Eidenberger
        role: Tänzerin · Musik- und Tanzpädagogin
        bio: Verena tanzt Contact Improvisation seit sie 18 ist, ist Musik- und Tanzpädagogin und freut sich darauf ihr Wissen spielerisch zu teilen. Sie liebt es frei zu tanzen und mit Körper, Stimme oder Instrumenten zu improvisieren.
      - name: Fabio Maria Gerhold
        image: assets/images/fabio.jpg
        alt: Fabio Maria Gerhold
        role: Tänzer · Yogalehrer
        bio: Fabio unterrichtet Yoga und Contact Improvisation in Graz. Seine Arbeit verbindet Achtsamkeit, Embodiment und kreative Forschung. Er ist inspiriert von der Philosophie von Martin Buber und der Frage, wie wir uns wirklich begegnen können.

  faq:
    label: Häufige Fragen
    heading: Gut zu wissen
    items:
      - q: Brauche ich Vorkenntnisse?
        a: Nein, gar keine. Dieser Block war speziell für Menschen ohne jegliche Bewegungserfahrung konzipiert. Wir starteten bei Null.
      - q: War das wirklich kostenlos?
        a: Ja, komplett. Der 6-Wochen-Block wurde durch den ASVÖ und die Initiative Bewegungsrevolution gefördert.
      - q: Was sollte man mitbringen?
        a: Bequeme Kleidung, in der du rollen kannst (ohne harte Reißverschlüsse), rutschfeste Socken oder barfuß, eine Wasserflasche.
      - q: Kann ich jetzt noch einsteigen?
        a: Dieser Block ist abgeschlossen. Du kannst aber jederzeit zum offenen Montagskurs kommen.
      - q: Wie kann ich euch erreichen?
        a: Schreib uns unter hello ät wildcare.space.

