en:
  title: Bewegungsrevolution
  registration:
    label: Go to the open Monday class
    note: Bewegungsrevolution 2026 is complete. The open Monday class continues.
  facts:
    date: 11 May – 15 June 2026
    time: Mondays, 17:45–19:15
    location: Orpheumgasse 11, Graz
    price: Free
    duration: 6 weeks
    format: []
    schedule: []
    price_details: []
  card:
    tags:
      - label: Archive
        style: default
      - label: Contact Improvisation
        style: moss
    subtitle: 6 weeks of free Contact Improvisation
    summary: A funded beginner block in Graz with six themes around gravity, touch, weight, consent and jam culture.
    detail_label: Read the archive
  hero:
    badge: Funded · Free · Archive
    subtitle: Playfully explore your own body — with gravity, balance and touch. No prior experience needed. Really none.
    video_poster: assets/images/bewegungsrevolution.png
    headline: Contact Improvisation.
    headline_accent: Free. 6 Weeks.
  research:
    label: The Schedule
    heading: 6 Weeks, 6 Topics
    fields:
      - number: Week 1 · 11 May
        title: Small Dance
        text: Feeling gravity and noticing that we are constantly in motion on our own — in a dance with gravity. The floor is your first dance partner.
      - number: Week 2 · 18 May
        title: Not falling, but flowing
        text: 'Yielding: the art of giving in. Learning to soften the body — alone and together. The body that can soften can do anything.'
      - number: Week 3 · 25 May
        title: Consent and Listening
        text: How the body says yes and no before the mouth does. Practising sensing proximity, communicating boundaries and listening through touch. Consent is the conversation you’re having the whole time.
      - number: Week 4 · 1 June
        title: Letting Weight Flow
        text: Pouring weight is not dumping weight. From the wall to partner leaning to falling together — finding the point where no one can tell who is carrying whom.
      - number: Week 5 · 8 June
        title: The Rolling Point of Contact
        text: 'The core of CI: the point where two bodies meet, and we let it travel. Not directing, but following. The rolling point is the conversation itself.'
      - number: Week 6 · 15 June
        title: The Jam
        text: 'No teacher calls out exercises. You choose: dance alone, dance with someone, watch, rest. The jam is where CI lives — just a space, a floor and other people ready to listen with their bodies.'
        highlighted: true
  facilitators:
    label: Who teaches
    heading: Your Guides
    members:
      - name: Verena Eidenberger
        image: assets/images/verena.jpg
        alt: Verena Eidenberger
        role: Dancer · Music & Dance Educator
        bio: Verena has been dancing Contact Improvisation since she was 18. She is a music and dance educator and loves sharing her knowledge playfully. She loves to dance freely and improvise with body, voice or instruments.
      - name: Fabio Maria Gerhold
        image: assets/images/fabio.jpg
        alt: Fabio Maria Gerhold
        role: Dancer · Yoga Teacher
        bio: Fabio teaches Yoga and Contact Improvisation in Graz. His work combines mindfulness, embodiment and creative exploration. He is inspired by Martin Buber’s philosophy and the question of how we can truly meet each other.
    quotes:
      - quote: “Through the class I gained a better understanding of what Contact Improvisation is. My body understands more too, and I can use my body more consciously in the dance encounter. And it’s simply joyful!”
        author: Anna
      - quote: “I’ve been dancing for a while, but I love dropping by the class whenever I have time. The positive, creative energy feels amazing and I always get new inspiration to keep exploring, to integrate new things — it simply makes you feel alive and happy.”
        author: Iris
  faq:
    label: FAQ
    heading: Good to Know
    items:
      - q: Do I need prior experience?
        a: None at all. This block was specifically designed for people with no movement experience whatsoever. We started from zero.
      - q: Was it really free?
        a: Yes, completely. The 6-week block was funded by ASVÖ and the Bewegungsrevolution initiative.
      - q: What should I bring?
        a: Comfortable clothing you can roll in (no hard zippers), non-slip socks or barefoot, a water bottle.
      - q: Can I still join now?
        a: This block is complete. You can join the open Monday class anytime.
      - q: How can I contact you?
        a: You can email us using the address hello ät wildcare.space.
