        bio: Fabio teaches Yoga and Contact Improvisation in Graz. His work combines mindfulness, embodiment and creative exploration. He is inspired by Martin Buber’s philosophy and the question of how we can truly meet each other.

  faq:
    label: FAQ
    heading: Good to Know
    items:
      - q: Do I need prior experience?
        a: None at all. This block was specifically designed for people with no movement experience whatsoever. We started from zero.
      - q: Was it really free?
