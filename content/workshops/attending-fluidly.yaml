  description:
    label: The Practice
    heading: Attending to what is already moving.
    body: |-
      **Attending Fluidly: water bodies, earth-beings** is a Contact Improvisation workshop and jam where we explore how we move and relate through touch, weight, and shared balance. Just as the Earth is composed mostly of water, we can explore our human bodies as largely water bodies.

      I invite us to pay attention to what is already happening in the body: shifts in weight, breath, temperature, tension, release—and how these change when we meet another body.

      Drawing on influences such as mayfield brooks, Joy Mariama Smith and Anya Cloud, we focus on practical tools for awareness: the inner ear, balance, gravity, and how we orient ourselves when we are moving, being moved, or supporting someone else.

      We work with changing states—holding weight, releasing into the floor, sharing weight with a partner, or moving in continuous flow—noticing what changes in your body in each state, and how you respond to another person doing the same. We treat trust as something built through clear attention, listening, and consent in movement.

      The workshop opens into a themed jam where we continue exploring these ideas through open Contact Improvisation practice.
