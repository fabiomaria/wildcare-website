    note_title: Cellular Touch
    note_text: 'Flowing in, flowing out: the membrane becomes a dancing boundary between self, space and partner.'
  description:
    label: The Practice
    heading: Touch as cellular space.
    paragraphs:
      - Cellular touch arises from the awareness of semipermeable membrane layers, which are responsible for our form and organization. Transitional fluids pass, are received and exchanged through a quality of dance that facilitates the exchange between and within us.
      - Cellular touch is made possible when we perceive the movement of fluid in and out of a membrane.
      - <b>Flowing in</b> comes with a sense of self-fulfillment until the saturation of our internal structure, while preserving its flexibility and reliability.
      - <b>Flowing out</b> allows a sense of Release into Gravity & Space (while continuing sensing the anchor to the ground, through the Center connection and extended reach of the 'roots')
    show_info: true
  research:
    label: Research Fields
    heading: What we explore
    fields:
      - number: '01'
        title: Membrane
        text: 'Flowing in: sensing fullness, stability and flexibility from within.'
      - number: '02'
        title: Fascia
        text: Reading superficial and deep fascia as a language of local and extended stretch.
      - number: '03'
        title: Unfixing
        text: Noticing familiar patterns and letting tiny gestures grow into new movement pathways.
      - number: '04'
        title: Falling
        text: Yielding into the support of the earth, partners and the shared body.
      - number: '05'
        title: Momentum
        text: Translating forward energy into rotation and using the geometry of shared movement.
      - number: '06'
        title: Flow
        text: Pendulum motion, trios and duets as invitations to expand trust and space.
        highlighted: true
  image_band:
    label: Flowing in / Flowing out
    heading: A dancing boundary
    text: Holding together is not holding on. We practice receiving, yielding, expanding, anchoring back into the earth.
    image: assets/images/cellular-touch-membrane.jpg
