    facilitators:
      label: Facilitator
      members:
        - name: Fran
          image: /assets/uploads/mmexport1777769572196.webp
          image_focus: center
          alt: Fran
          role: Contact Improvisation · Social Inquiry
          bio: |-
            Contact Improvisation facilitator, researcher and writer exploring movement as a form of social inquiry. His work investigates how attention, touch, consent and cooperation emerge through embodied practice, treating Contact Improvisation as both a dance form and a way of studying how we organise ourselves together.

            Drawing from experiences across Europe, Latin America and Asia, he designs workshops that combine movement research with curiosity, critical reflection and collective experimentation.
      quotes:
        - quote: “Don’t be polite, be precise. Don’t impose, propose. Don’t lift, accompany.”
          author: How We Move Together
        - quote: “Listening is labour; consent is not a moment but a process.”
          author: How We Move Together
