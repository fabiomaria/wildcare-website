  title: Sommerpause und was kommt
  summary: Zeit für einen Rückblick und einen kleinen Ausblick auf das was kommt.
  body: |-
    Hallo und danke, dass du hier bist. Danke, dass du auf deine Weise zu Wild Care beigetragen hast. Heute nehme ich mir Zeit für einen Rückblick und einen kleinen Ausblick auf das was kommt.

    ## Montagskurs

    Vor anderthalb Jahren haben Verena und Fabio begonnen in Graz regelmäßig Contact Improvisation Workshops zu halten- ein offenes Format immer am Montag Abend, das sich bewährt hat. Vielen Dank für eure Teilnahme!

    Wir starten wieder in der zweiten oder dritten Septemberwoche- Infos folgen per Email und auf der Website: [wildcare.space/montagskurs](wildcare.space/montagskurs)

    ## Community Events

    Das alles hier passiert nur, weil ein paar Menschen ihre Begeisterung für die gemeinsame Praxis und die Erfahrungen, die wir dort machen dürfen, teilen wollen.

    Mir ist es wichtig, dass so ein Raum entsteht in dem sich alle eingeladen fühlen so beizutragen, wie es sich für sie richtig anfühlt. Sei es als Teilnehmer auf der Jam, als die Person, die den Schlüssel dabeihat. oder mit eigenen Ideen und Initiativen.

    Letzten Montag war spürbar, was so möglich wird: Tine zu einer Jam in ihrem wunderschönen Garten eingeladen. Jess, Jakob und Bintang haben musiziert und viele von Euch waren dabei. Für mich war es bewegend zu sehen und zu spüren wie wir dort zusammengekommen sind.

    Fast wie von selbst, haben wir einen ganz besonderen Abend gestaltet. in diesem Video könnt ihr einen Eindruck davon gewinen: [instagram.com/p/DcHVi64NL5w/](instagram.com/p/DcHVi64NL5w/)

    ## Gäste

    Vergangenes Wochenende hat Valentyn Korotkevych als erster Gast einen Workshop mit uns geteilt. Das hat mich ermutigt und im Herbst gibt es schon konkrete Pläne:

    Am Samstag dem 12. September bietet Emelia aus Uppsala, Schweden einen Workshop mit dem Titel [**Attending Fluidly: water bodies, earth-beings**](https://wildcare.space/attending-fluidly.html)[**.**](https://wildcare.space/attending-fluidly.html)[ ](https://wildcare.space/attending-fluidly.html)Anschließend, ab 18:30 gibt es eine offene Jam zu der ihr herzlich eingeladen seid, auch wenn ihr nicht am Workshop teilnehmen wollt.

    Am Wochenende vom 9-11 Oktober wird [fran](https://www.instagram.com/a_yielding_fran/) aus Italien einen Workshop mit dem Titel [How we move togethe](https://wildcare.space/how-we-move-together.html)r mit uns teilen. Dabei erforschen wir spielerisch die gesellschaftlichen Strukturen in denen und mit denen wir uns bewegen. 

    So wie ich fran kenne wird es unterhaltsam, verspielt und ich freue mich sehr. Das Event startet am Freitag 9. Oktober  mit einer [offenen Jam für alle](https://wildcare.space/events/how-we-move-together-open-jam)[.](https://wildcare.space/events/how-we-move-together-open-jam)

    ## Verein

    Ein paar von Euch wissen es bereits: Ich möchte einen Verein gründen.

    Warum? Weil uns diese rechtliche Persönlichkeit viele Möglichkeiten eröffnen kann, die ich uns nicht vorenthalten will.

    Langsam verdichtet sich eine kleine Gruppe von Menschen, die Interesse haben daran mitzuwirken. Falls du auch Interesse oder Ideen hast, [schreib uns.](https://wildcare.space/kontakt)

    Ich freue mich sehr über alles. Danke Euch und habt einen schönen Sommer!

    Fabio
  image_alt: Wildcare Sommerpause
  hero_alt: Wildcare Sommerpause
en:
  title: Summer break and what's next
  summary: Time for a look back and a brief look ahead to what's to come.
  body: |-
    Hello and thank you for being here. Thank you for contributing to Wild Care in your own way. Today I'm taking some time to look back and give a brief preview of what's to come.

    ## Monday class

    A year and a half ago, Verena and Fabio started holding regular Contact Improvisation workshops in Graz – an open format every Monday evening that has proven successful. Thank you so much for your participation!

    We will start again in the second or third week of September - information will follow via email and on the website: [wildcare.space/montagskurs](wildcare.space/montagskurs)

    ## Community Events

    All of this is only happening because a few people want to share their enthusiasm for our practice and the experiences it creates for us.

    It's important to me that Wild Care is a space where everyone feels invited to contribute in whatever way feels right to them. Whether as a participant at the jam, as the person with the key, or with their own ideas and initiatives.

    Last Monday, it was palpable what becomes possible in this way: Tine invited us to a jam session in her beautiful garden. Jess, Jakob, and Bintang played music, and many of you were there. For me, it was moving to see and feel how we came together there.

    Almost effortlessly, we created a truly special evening. You can get a glimpse of it in this video: [instagram.com/p/DcHVi64NL5w/](instagram.com/p/DcHVi64NL5w/)

    ## Guests

    Last weekend, Valentyn Korotkevych was our first guest to share a workshop with us. This has encouraged me, and we already have concrete plans for the fall:

    On Saturday, September 12th, Emelia from Uppsala, Sweden will offer a workshop entitled [**Attending Fluidly: water bodies, earth-beings**. ](https://wildcare.space/attending-fluidly.html)Afterwards, starting at 6:30 pm, there will be an open jam session to which you are cordially invited, even if you do not wish to participate in the workshop.

    From October 9th to 11th, [f](https://www.instagram.com/a_yielding_fran/)[ran](https://www.instagram.com/a_yielding_fran/)[ ](https://www.instagram.com/a_yielding_fran/)from Italy will be sharing a workshop with us entitled [How we move together](https://wildcare.space/how-we-move-together.html). In this workshop, we will playfully explore the social structures within which and with which we move.

    Knowing fran, it will be entertaining and playful, and I'm really looking forward to it. The event starts on Friday, October 9th, with an [open jam session for everyone](https://wildcare.space/events/how-we-move-together-open-jam)[ ](https://wildcare.space/events/how-we-move-together-open-jam).

    Emilia from Sweden will also be arriving in September - more details to follow.

    ## Association

    Some of you already know: I want to found an association (Verein).

    Why? Because this legal entity can open up many opportunities that I don't want to withhold from us.

    A small group of people interested in participating is slowly forming. If you are also interested or have ideas, please [get in touch..](https://wildcare.space/kontakt)

    I'm so happy about all of this. Thank you and have a wonderful summer!

    Fabio
  image_alt: Wildcare Summer Break
  hero_alt: Wildcare Summer Break
