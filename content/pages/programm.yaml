en:
  hero:
    label: Programme
    heading: Art as Encounter.
    intro: Our offerings combine artistic research, bodywork and social practice — open to anyone who is curious. We call the individual formats Labs.
  labs:
    label: Our Labs
    heading: One frame, many materials
    intro: Wild Care isn't tied to a single art form. We call our formats Labs — each works with a different material, all with the same attitude.
    items:
      - name: Movement
        status_label: active
        text: Contact Improvisation, every Monday. Our first and currently most alive Lab.
      - name: Sound
        status_label: forming
        text: Improvisation with voice, body and instruments. Growing out of our Monday practice.
      - name: Word
        status_label: forming
        text: Writing as a form of noticing. Begins in the Journal, looking for a format of its own.
      - name: Image
        status_label: open for proposals
        text: Drawing, photography, material. Nobody here yet — the place is free.
      - name: Ritual & Table
        status_label: open for proposals
        text: Cooking, eating, marking the turn of the year together. A Lab we'd like to exist.
    cta_text: Do you work with one of these materials — or something else entirely?
    cta_button: Propose a Lab
    cta_url: mitmachen.html
  core:
    label: Our First Lab · Open Contact Improvisation Practice
    heading: Monday Class
    info_title: At a Glance
    rows:
      - icon: clock
        label: What
        value: Contact Improvisation — open workshop
      - icon: calendar
        label: When
        value: Every Monday, 17:45 – 19:15
      - icon: location
        label: Where
        value: Orpheumgasse 11, 8020 Graz
      - icon: cost
        label: Cost
        value: Donation-based
      - icon: people
        label: For
        value: Everyone — with or without prior experience
    register_label: Sign up now
    more_label: Learn more
    description_heading: What to Expect
    paragraphs:
      - text: Contact Improvisation is the playful exploration of gravity, balance and touch. There are no fixed steps, no choreography and no pressure to perform — just you, the space and the people in it.
      - text: You learn to share and release weight, to listen through touch and to become more aware of your body. Along the way, you naturally regulate your nervous system, practise communicating boundaries and develop a fine sense for yourself and those around you.
      - text: 'Each session begins with a guided warm-up and flows into an open jam — a free dance time where anything can happen: stillness, movement, encounter.'
    quote: “You don’t need any dance experience. Just comfortable clothing, curiosity and the willingness to try something new.”
  projects:
    label: Current Projects
    heading: What’s Happening Now
  archive:
    label: Archive
    heading: Past Projects
    intro: Completed workshops and projects remain available as a record of our work.
    button: View archive
  outlook:
    label: Outlook
    heading: What’s Coming Next
    intro: Projects we’re currently developing or planning. Something is taking shape here.
  cta:
    label: Invitation
    heading: Come by.
    text: You don’t need any experience, just comfortable clothing and curiosity. Every Monday, 17:45, Orpheumgasse 11, Graz.
    button: Get in touch
