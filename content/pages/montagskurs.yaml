  en:
    breadcrumb: Monday Class
    hero:
      label: Open Workshop
      heading: Contact Improvisation in Graz.
      subtitle: Playfully explore your own body — with gravity, balance and touch. No prior experience needed. Really none.
      schedule: Every Monday, 17:45–19:15
      basis: Donation-based
      cta: Sign up now
    practice:
      label: The Practice
      heading: What is Contact Improvisation?
      p1: Contact Improvisation is a contemporary dance and movement form that originated in the USA in the 1970s. At its core is the play with gravity, touch and balance — a shared exploration through the body.
      p2: 'It touches not only the body but also the mind: in the encounter, a field of presence, trust and creative attention emerges. Contact Improvisation invites you to let go of habits, to embrace the unknown — and to experience movement as a form of dialogue, beyond words.'
    learn:
      label: What you explore
      heading: In the Monday Class
      cards:
        - title: Body Awareness
          text: Feel your body more consciously — weight, breath, grounding. The foundation for everything that follows.
        - title: Sharing Weight
          text: Giving and receiving weight. Trust in the body of your partner — and in your own.
        - title: Falling & Catching
          text: Getting to the ground safely, being caught. Losing the fear of falling — in dance and in life.
        - title: Touch as Language
          text: Communicating through the body — listening, responding, sensing and setting boundaries.
        - title: Nervous System Regulation
          text: Calm your nervous system through mindful movement and touch — naturally, along the way.
        - title: Free Dance
          text: Each session flows into an open jam — a free dance time where anything can happen.
      donation_note: "The class is donation-based. You give what you can. As a guideline, 10–20\_€ per session helps us, whatever feels right for you."
    testimonials:
      label: Feedback
      heading: What participants say
      items:
        - quote: “Through the class I gained a better understanding of what Contact Improvisation is. My body understands more too, and I can use my body more consciously in the dance encounter. And it’s simply joyful!”
        - quote: “I’ve been dancing for a while, but I love dropping by the class whenever I have time. The positive, creative energy feels amazing and I always get new inspiration to keep exploring, to integrate new things — it simply makes you feel alive and happy.”
    team:
      label: Who teaches
      heading: Your Guides
      members:
        - name: Verena Eidenberger
          role: Dancer · Music & Dance Educator
          bio: Verena has been dancing Contact Improvisation since she was 18. She is a music and dance educator and loves sharing her knowledge playfully. She loves to dance freely and improvise with body, voice or instruments.
        - name: Fabio Maria Gerhold
          role: Dancer · Yoga Teacher
          bio: Fabio teaches Yoga and Contact Improvisation in Graz. His work combines mindfulness, embodiment and creative exploration. He is inspired by Martin Buber’s philosophy and the question of how we can truly meet each other.
    faq:
      label: FAQ
      heading: Good to Know
      items:
        - q: Do you always dance in pairs?
          a: No. We dance in changing constellations — alone, in pairs, in groups. There are no fixed partners.
        - q: What should I bring?
          a: Comfortable clothing you can roll in (no hard zippers), non-slip socks or barefoot, a water bottle.
        - q: Do I need dance experience?
          a: None at all. We always start from zero and build up slowly. Everyone is welcome — just as you are.
        - q: How much does it cost?
          a: "The class is donation-based. You give what you can. As a guideline, 10–20\_€ per session helps us."
    crosslink:
      label: Current Project
      heading: Bewegungsrevolution
      text: 6 weeks of free Contact Improvisation for beginners. Funded by ASVÖ. 11 May – 15 June 2026.
      button: Learn more
    cta:
      label: Invitation
