    breadcrumb: Montagskurs
    hero:
      label: Offener Workshop
      heading: Contact Improvisation in Graz.
      heading_html: Contact Improvisation<br>in <span>Graz</span>.
      subtitle: Spielerisch den eigenen Körper erforschen — mit Schwerkraft, Gleichgewicht und Berührung. Keine Vorkenntnisse nötig. Wirklich keine.
      schedule: Jeden Montag, 17:45–19:15
      address: Orpheumgasse 11, Graz
