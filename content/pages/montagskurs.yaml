      image_alt: Contact Improvisation
    practice:
      label: Die Praxis
      heading: Was ist Contact Improvisation?
      p1: Contact Improvisation ist eine zeitgenössische Tanz- und Bewegungsform, die in den 1970er-Jahren in den USA entstand. Im Zentrum steht das Spiel mit Schwerkraft, Berührung und Gleichgewicht — das gemeinsame Forschen mit dem Körper.
      p2: 'Dabei wird nicht nur der Körper, sondern auch der Geist berührt: In der Begegnung entsteht ein Feld von Präsenz, Vertrauen und kreativer Aufmerksamkeit. Contact Improvisation lädt ein, Gewohnheiten loszulassen, sich auf das Unbekannte einzulassen — und Bewegung als eine Form des Dialogs zu erleben, jenseits von Worten.'
      poster: assets/images/warum-ci.jpg
    learn:
      label: Was du erforschst
      heading: Im Montagskurs
      cards:
        - title: Körperwahrnehmung
          text: Deinen Körper bewusster spüren — Gewicht, Atem, Erdung. Die Basis für alles, was kommt.
        - title: Gewicht teilen
          text: Gewicht abgeben und aufnehmen. Vertrauen in den Körper des Gegenübers — und in den eigenen.
        - title: Fallen & Auffangen
          text: Sicher zu Boden kommen, sich auffangen lassen. Die Angst vor dem Fallen verlieren — im Tanz und im Leben.
        - title: Berührung als Sprache
          text: Durch den Körper kommunizieren — zuhören, antworten, Grenzen spüren und setzen.
        - title: Nervensystem-Regulation
          text: Durch achtsame Bewegung und Berührung dein Nervensystem beruhigen — ganz nebenbei.
        - title: Freies Tanzen
          text: Jede Session mündet in eine offene Jam — eine freie Tanzzeit, in der alles passieren darf.
      donation_note: "Der Kurs ist auf Spendenbasis. Du gibst, was für dich möglich ist. Als Richtwert helfen uns 10–20\_€ pro Termin, ganz so, wie es für dich passt."
    testimonials:
      label: Feedback
      heading: Was Teilnehmer:innen sagen
      items:
        - quote: „Ich habe durch den Kurs ein besseres Verständnis bekommen, was Contact Improvisation ist, auch mein Körper versteht mehr und ich kann meinen Körper in der tänzerischen Begegnung bewusster einsetzen. Und es macht einfach Freude!“
          author: Anna
        - quote: „Ich tanze schon länger, schau aber wenn ich Zeit habe sehr gerne im Kurs vorbei, da die positive, kreative Energie sich super anfühlt und ich jedesmal neue Anregungen bekomme, weiter zu probieren, Neues zu integrieren — macht einfach richtig lebendig und glücklich.“
          author: Iris
    team:
      label: Wer unterrichtet
      heading: Deine Begleiter:innen
      members:
        - name: Verena Eidenberger
          image: assets/images/verena.jpg
          alt: Verena Eidenberger
          role: Tänzerin · Musik- und Tanzpädagogin
          bio: Verena tanzt Contact Improvisation seit sie 18 ist, ist Musik- und Tanzpädagogin und freut sich darauf ihr Wissen spielerisch zu teilen. Sie liebt es frei zu tanzen und mit Körper, Stimme oder Instrumenten zu improvisieren.
        - name: Fabio Maria Gerhold
          image: assets/images/fabio.jpg
          alt: Fabio Maria Gerhold
          role: Tänzer · Yogalehrer
          bio: Fabio unterrichtet Yoga und Contact Improvisation in Graz. Seine Arbeit verbindet Achtsamkeit, Embodiment und kreative Forschung. Er ist inspiriert von der Philosophie von Martin Buber und der Frage, wie wir uns wirklich begegnen können.
    faq:
      label: Häufige Fragen
      heading: Gut zu wissen
      items:
        - q: Tanzt man immer zu zweit?
          a: Nein. Wir tanzen in wechselnden Konstellationen — alleine, zu zweit, in Gruppen. Es gibt keine festen Paare.
        - q: Was soll ich mitbringen?
          a: Bequeme Kleidung, in der du rollen kannst (ohne harte Reißverschlüsse), rutschfeste Socken oder barfuß, eine Wasserflasche.
        - q: Brauche ich Tanzerfahrung?
          a: Nein, gar keine. Wir beginnen immer bei Null und bauen langsam auf. Jede:r ist willkommen — genau so, wie du bist.
        - q: Was kostet es?
          a: "Der Kurs ist auf Spendenbasis. Du gibst, was für dich möglich ist. Als Richtwert helfen uns 10–20\_€ pro Termin."
