  de:
    title: Community Jam im Garten
    summary: 'Ein gemütlicher Abend in Andritz: Wir tanzen Contact Improvisation und verbringen gemeinsam Zeit.'
    description: |
      ## Anreise

      - Haltestelle Rotmoosweg (Bus 41) oder Oberandritz (Bus 53)
      - Von beiden Haltestellen sind es 3–5 Minuten zu Fuß.

      ## Was du mitbringen solltest

      - Badezeug — es gibt ein Schwimmbad.
      - Fingerfood oder Snacks, gerne auch etwas Gesundes zum Teilen.

      ## Verpflegung

      Getränke werden gestellt. Wenn du etwas Besonderes möchtest, bring es gerne selbst mit.
