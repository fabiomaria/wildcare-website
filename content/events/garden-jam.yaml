locales:
  de:
    title: Community Jam im Garten
    summary: |-
      Ein gemütlicher Abend in Andritz. Wir tanzen Contact Improvisation und verbringen gemeinsam Zeit.
      Es gibt ein Schwimmbad, also bring gerne Badezeug mit.

      Anreise:
      Haltestelle Rotmoosweg ,Busnr 41; oder bis Haltestelle Oberandritz,Busnr 53.
      Jeweils 3-5 Minuten zu gehen.

      Essen
      Wir würden gerne gemeinsam Zeit verbringen und essen. Bringt gerne Fingerfood und Snacks mit (gerne auch gesund). 

      Getränke
      Tine ist so lieb und bringt einiges. Wenn ihr etwas spezielles wollt gerne selbst mitbringen.
      essen ja-Fingerfood oder Snacks,vielleicht?Ich stelle die Getränke.
